sync_now:
  fields:
    entry_id:
      selector:
        text:

log_headache:
  fields:
    entry_id:
      selector:
        text:
    onset:
      selector:
        datetime:
    end:
      selector:
        datetime:
    intensity:
      selector:
        number:
          min: 1
          max: 10
          mode: slider
    aura:
      selector:
        boolean:
    medication:
      selector:
        text:
    notes:
      selector:
        text:
          multiline: true

end_headache:
  fields:
    entry_id:
      selector:
        text:
    end:
      selector:
        datetime:
    headache_id:
      selector:
        text:

delete_headache:
  fields:
    entry_id:
      selector:
        text:
    headache_id:
      required: true
      selector:
        text:

refresh_migraine_forecast:
  fields:
    entry_id:
      selector:
        text:
    backfill_days:
      selector:
        number:
          min: 1
          max: 365
          mode: box
